################################################################################
#  nginx.conf  –  Single gateway on :8000 (or :80)
#  Routes:
#    /ai/voice-clone*  →  TTS service  :8002
#    everything else   →  Main service :8001
################################################################################

events {
    worker_connections 1024;
}

http {
    # ── upstream definitions ────────────────────────────────────────────────
    upstream main_service {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    upstream tts_service {
        server 127.0.0.1:8002;
        keepalive 8;
    }

    # ── logging ─────────────────────────────────────────────────────────────
    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent upstream=$upstream_addr '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log  warn;

    # ── server block ─────────────────────────────────────────────────────────
    server {
        listen 8000;
        server_name _;

        # Large uploads (video files can be big)
        client_max_body_size 600M;

        # Long-running AI jobs can take minutes
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;
        proxy_connect_timeout   30s;

        proxy_http_version 1.1;
        proxy_set_header Connection      "";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # ── TTS / Voice-cloning routes → :8002 ──────────────────────────────
        location ~ ^/ai/voice-clone {
            proxy_pass http://tts_service;
        }

        # ── Everything else → :8001 ─────────────────────────────────────────
        location / {
            proxy_pass http://main_service;
        }
    }
}